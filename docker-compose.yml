services:
  backend:
    image: ghcr.io/${GITHUB_ORG}/good-idea-randomizer:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_SCHEMA: ${SUPABASE_SCHEMA:-public}
      RUST_LOG: ${RUST_LOG:-info}
      VIRTUAL_HOST: good-idea-randomizer.${SERVER_DOMAIN}
      LETSENCRYPT_HOST: good-idea-randomizer.${SERVER_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - reverse-proxy
      - outbound

networks:
  reverse-proxy:
    external: true
    name: ${DOCKER_NETWORK}
  outbound:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "172.31.0.0/24"
        - subnet: "fd00:b1be:1000::/64"
